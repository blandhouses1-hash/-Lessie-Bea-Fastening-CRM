<!DOCTYPE html>
<html>
<head>
<title>Lessie Bea Fastening CRM</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { font-family: Arial; background:#3a3a3a; color:white; margin:0; }

header {
    background:#ff69b4;
    padding:15px;
    text-align:center;
}

.title { font-size:20px; font-weight:bold; }
.date { font-size:14px; margin-top:5px; }

.box {
    background:#4a4a4a;
    margin:10px;
    padding:15px;
    border-radius:12px;
}

.big { font-size:48px; text-align:center; }
.sub { text-align:center; color:#00ffd5; }

input, textarea, button, select {
    width:100%;
    padding:12px;
    margin:6px 0;
    border-radius:8px;
    border:none;
    font-size:16px;
}

button { background:#ff69b4; color:white; }

li { margin:12px 0; padding:8px; background:#5a5a5a; border-radius:8px; }

.green { color:#00ff88; }
.red { color:#ff4d4d; }
</style>
</head>

<body>

<header>
    <div class="title">Lessie Bea Fastening CRM</div>
    <div class="date" id="todayDate"></div>
</header>

<!-- CALORIE GOAL -->
<div class="box">
    <h3>Daily Calorie Goal</h3>
    <input id="calGoalInput" type="number">
    <button onclick="setGoal()">Save Goal</button>
    <h4>Goal: <span id="goalDisplay">1700</span></h4>
</div>

<!-- FASTING -->
<div class="box">
    <div class="big" id="timer">00:00:00</div>
    <div class="sub" id="remaining">Time Left: --</div>

    <select id="fastType">
        <option value="16">16:8</option>
        <option value="18">18:6</option>
        <option value="23">OMAD</option>
        <option value="custom">Custom</option>
    </select>

    <input id="customHours" type="number">

    <button onclick="startFast()">Start Fast</button>
    <button onclick="endFast()">End Fast</button>

    <textarea id="notes"></textarea>
</div>

<!-- WATER -->
<div class="box">
    <h3>💧 Water Intake</h3>
    <input id="waterInput" type="number">
    <button onclick="addWater()">Add Water</button>

    <h4>Total Today: <span id="waterTotal">0</span> oz</h4>

    <ul id="waterList"></ul>
</div>

<!-- FOOD -->
<div class="box">
    <h3>Food Tracker</h3>

    <input id="foodName" placeholder="Type food">
    <button onclick="addFood()">Add Food</button>

    <h4>Total Calories: <span id="totalCalories">0</span></h4>
    <h4>Calories Left: <span id="calLeft">1700</span></h4>

    <ul id="foodList"></ul>
</div>

<!-- FAST HISTORY -->
<div class="box">
    <h3>Fasting History</h3>
    <ul id="historyList"></ul>
</div>

<script>

todayDate.innerText = new Date().toDateString();

/* GOAL */
let DAILY_LIMIT = localStorage.getItem("goal") ? parseInt(localStorage.getItem("goal")) : 1700;

function setGoal(){
    let g = parseInt(calGoalInput.value);
    if(!g) return;
    DAILY_LIMIT = g;
    localStorage.setItem("goal", g);
    goalDisplay.innerText = g;
}

/* DATE */
function today(){
    return new Date().toISOString().slice(0,10);
}

/* FOOD */
function addFood(){
    let name = foodName.value;
    if(!name) return;

    let data = JSON.parse(localStorage.getItem("food_"+today())) || [];
    data.push({name:name, cal:0});

    localStorage.setItem("food_"+today(), JSON.stringify(data));
    loadFood();
}

function loadFood(){
    let data = JSON.parse(localStorage.getItem("food_"+today())) || [];
    foodList.innerHTML = "";

    let total = 0;

    data.forEach((x,i)=>{
        total += x.cal;

        let li = document.createElement("li");
        li.innerHTML = `
        ${x.name} - ${x.cal} cal
        <button onclick="deleteFood(${i})">Delete</button>
        `;
        foodList.appendChild(li);
    });

    totalCalories.innerText = total;
    calLeft.innerText = DAILY_LIMIT - total;
}

function deleteFood(i){
    let data = JSON.parse(localStorage.getItem("food_"+today()));
    data.splice(i,1);
    localStorage.setItem("food_"+today(), JSON.stringify(data));
    loadFood();
}

/* WATER */
function addWater(){
    let oz = parseFloat(waterInput.value);
    if(!oz) return;

    let data = JSON.parse(localStorage.getItem("water_"+today())) || [];
    data.push(oz);

    localStorage.setItem("water_"+today(), JSON.stringify(data));
    loadWater();
}

function loadWater(){
    let data = JSON.parse(localStorage.getItem("water_"+today())) || [];
    waterList.innerHTML = "";

    let total = 0;

    data.forEach((x,i)=>{
        total += x;

        let li = document.createElement("li");
        li.innerHTML = `
        ${x} oz
        <button onclick="deleteWater(${i})">Delete</button>
        `;
        waterList.appendChild(li);
    });

    waterTotal.innerText = total;
}

function deleteWater(i){
    let data = JSON.parse(localStorage.getItem("water_"+today()));
    data.splice(i,1);
    localStorage.setItem("water_"+today(), JSON.stringify(data));
    loadWater();
}

/* FASTING */
let timer;

function startFast(){
    let hrs = fastType.value === "custom"
        ? parseFloat(customHours.value)
        : parseInt(fastType.value);

    let start = new Date();
    let end = new Date(start.getTime() + hrs * 3600000);

    localStorage.setItem("start", start);
    localStorage.setItem("end", end);
}

/* FIXED END FAST BUTTON */
function endFast(){
    clearInterval(timer);

    let start = new Date(localStorage.getItem("start"));
    let end = new Date();

    let diff = (end - start) / 1000;
    let h = Math.floor(diff / 3600);
    let m = Math.floor((diff % 3600) / 60);

    let data = JSON.parse(localStorage.getItem("fasts")) || [];

    data.push({
        date: today(),
        duration: h + "h " + m + "m",
        notes: notes.value
    });

    localStorage.setItem("fasts", JSON.stringify(data));
    loadHistory();
}

/* HISTORY */
function loadHistory(){
    let data = JSON.parse(localStorage.getItem("fasts")) || [];
    historyList.innerHTML = "";

    data.forEach((x,i)=>{
        let li = document.createElement("li");
        li.innerHTML = `
        ${x.date} - ${x.duration}<br>
        ${x.notes}<br>
        <button onclick="deleteFast(${i})">Delete</button>
        `;
        historyList.appendChild(li);
    });
}

function deleteFast(i){
    let data = JSON.parse(localStorage.getItem("fasts"));
    data.splice(i,1);
    localStorage.setItem("fasts", JSON.stringify(data));
    loadHistory();
}

/* INIT */
loadFood();
loadWater();
loadHistory();

</script>

</body>
</html>
