<script>

/* BETTER FOOD DATABASE */
const foodDB = [
{name:"cheese pizza", cal:285, p:12, c:36, f:10},
{name:"pepperoni pizza", cal:313, p:13, c:35, f:13},
{name:"slice pizza", cal:285, p:12, c:36, f:10},

{name:"grape fruit", cal:62, p:0.6, c:16, f:0.3},
{name:"grape soda", cal:150, p:0, c:40, f:0},

{name:"apple", cal:95, p:0.5, c:25, f:0.3},
{name:"banana", cal:105, p:1, c:27, f:0}
];

/* ASK USER FOR TYPE */
function getFoodDetails(input){
input = input.toLowerCase();

if(input.includes("pizza")){
let type = prompt("What kind? cheese / pepperoni / slice");
if(!type) return null;
return foodDB.find(f => f.name.includes(type.toLowerCase()+" pizza"));
}

if(input.includes("grape")){
let type = prompt("Fruit or soda?");
if(!type) return null;
return foodDB.find(f => f.name.includes("grape "+type.toLowerCase()));
}

/* normal match */
return foodDB.find(f =>
input.includes(f.name) || f.name.includes(input)
);
}

/* AUTO FILL */
function autoFillFood(){
let match = getFoodDetails(foodName.value);

if(match){
foodCal.value = match.cal;
foodProtein.value = match.p;
foodCarbs.value = match.c;
foodFat.value = match.f;
}
}

foodName.removeEventListener("input", autoFillFood);
foodName.addEventListener("blur", autoFillFood);

/* ADD FOOD */
function addFood(){
let food={
name:foodName.value,
cal:parseFloat(foodCal.value)||0,
protein:parseFloat(foodProtein.value)||0,
carbs:parseFloat(foodCarbs.value)||0,
fat:parseFloat(foodFat.value)||0
};

let data=JSON.parse(localStorage.getItem("food_"+today()))||[];
data.push(food);
localStorage.setItem("food_"+today(),JSON.stringify(data));

foodName.value="";
foodCal.value="";
foodProtein.value="";
foodCarbs.value="";
foodFat.value="";

loadFood();
}

/* LOAD FOOD */
function loadFood(){
let data=JSON.parse(localStorage.getItem("food_"+today()))||[];
foodList.innerHTML="";

let cal=0,pro=0,carb=0,fat=0;

data.forEach((x,i)=>{
cal+=Number(x.cal);
pro+=Number(x.protein);
carb+=Number(x.carbs);
fat+=Number(x.fat);

let li=document.createElement("li");
li.innerHTML=`
${x.name} - ${x.cal} cal
<br>Protein: ${x.protein}g
<br>Carbs: ${x.carbs}g
<br>Fat: ${x.fat}g
<button onclick="delFood(${i})">Delete</button>
`;
foodList.appendChild(li);
});

totalCalories.innerText=cal;
totalProtein.innerText=pro;
totalCarbs.innerText=carb;
totalFat.innerText=fat;
calLeft.innerText=DAILY_LIMIT-cal;
}

</script>
